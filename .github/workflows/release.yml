name: Release

# Tags `v*` build, smoke-test and publish a release. Manual runs and pull
# requests that touch packaging do everything except publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - packaging/**
      - about.toml
      - .cargo/**
      - .github/workflows/release.yml
      - crates/rooste-ssh/Cargo.toml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy (AppImage) runs without FUSE on CI machines.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: |
          mkdir -p target/notices
          cargo about generate -o target/notices/THIRD-PARTY-LICENSES.html packaging/about.hbs
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: target/notices/THIRD-PARTY-LICENSES.html

  linux:
    name: Linux packages
    needs: notices
    # The oldest supported runner, so the binaries run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The cache can restore output from an earlier run; start clean.
      - name: Remove old packages
        run: rm -rf target/packages target/rooste-ssh-*
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: target/notices
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager,cargo-generate-rpm
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rooste-ssh") | .version')" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p rooste-ssh -p rooste-cli
      - run: cargo packager --release -p rooste-ssh --formats deb,appimage
      - run: cargo generate-rpm -p crates/rooste-ssh -o target/packages/
      - name: Consistent file names
        run: |
          v=${{ steps.version.outputs.version }}
          cd target/packages
          mv rooste-ssh_${v}_amd64.deb rooste-ssh-${v}-amd64.deb
          mv rooste-ssh_${v}_x86_64.AppImage rooste-ssh-${v}-x86_64.AppImage
          ls -la
      - name: Tarball
        run: |
          name=rooste-ssh-${{ steps.version.outputs.version }}-linux-x86_64
          mkdir -p "target/$name"
          cp target/release/rooste-ssh target/release/rooste-cli LICENSE target/notices/THIRD-PARTY-LICENSES.html \
             packaging/linux/ee.prica.rooste-ssh.desktop packaging/icons/icon-256.png "target/$name/"
          tar -C target -czf "target/packages/$name.tar.gz" "$name"
          ls -la target/packages
      - name: Smoke test the installed .deb
        run: |
          sudo apt-get install -y ./target/packages/*.deb
          rooste-ssh --version
          rooste-cli --version
          test -f /usr/share/applications/rooste-ssh.desktop || ls /usr/share/applications | grep -i rooste
          docker build -t rooste-openssh -f crates/rooste-testkit/docker/openssh/Dockerfile crates/rooste-testkit/docker
          docker run -d --rm -p 2222:22 rooste-openssh
          for i in $(seq 1 30); do nc -z 127.0.0.1 2222 && break; sleep 1; done
          out=$(rooste-cli -p 2222 -i crates/rooste-testkit/keys/id_ed25519 --no-agent --host-key accept-new \
                --known-hosts "$RUNNER_TEMP/known_hosts" rooste@127.0.0.1 echo smoke-ok)
          echo "$out"
          test "$out" = "smoke-ok"
      - name: Smoke test the AppImage and RPM
        run: |
          chmod +x target/packages/*.AppImage
          target/packages/*.AppImage --appimage-extract-and-run --version
          sudo apt-get install -y rpm
          rpm -qpl target/packages/*.rpm | tee /dev/stderr | grep -q /usr/bin/rooste-cli
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
            target/packages/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            target/release/rooste-ssh
            target/release/rooste-cli

  macos:
    name: macOS disk image (${{ matrix.arch }})
    needs: notices
    # Apple Silicon runner; the Intel build is cross-compiled.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The cache can restore output from an earlier run; start clean.
      - name: Remove old packages
        run: rm -rf target/packages target/dmg
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: target/notices
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rooste-ssh") | .version')" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p rooste-ssh -p rooste-cli --target ${{ matrix.target }}
      # cargo-packager reads the binaries from target/release.
      - name: Stage the binaries
        run: |
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/rooste-ssh target/${{ matrix.target }}/release/rooste-cli target/release/
          file target/release/rooste-ssh
      - run: cargo packager --release -p rooste-ssh --formats app
      # Without a signature, macOS calls downloaded Apple Silicon apps
      # "damaged". An ad-hoc signature is free; notarization is not.
      - name: Ad-hoc sign the app
        run: |
          app=$(find target/packages -maxdepth 1 -name '*.app' | head -1)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --verbose=2 "$app"
      - name: Disk image
        run: |
          name=rooste-ssh-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          mkdir -p target/dmg
          cp -R target/packages/*.app target/dmg/
          ln -s /Applications target/dmg/Applications
          hdiutil create -volname "Rooste SSH" -srcfolder target/dmg -ov -format UDZO "target/packages/$name.dmg"
          ls -la target/packages
      - name: Smoke test the disk image
        if: matrix.arch == 'arm64'
        run: |
          hdiutil attach target/packages/*.dmg -mountpoint /tmp/rooste-dmg
          "/tmp/rooste-dmg/Rooste SSH.app/Contents/MacOS/rooste-ssh" --version
          "/tmp/rooste-dmg/Rooste SSH.app/Contents/MacOS/rooste-cli" --version
          hdiutil detach /tmp/rooste-dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-packages-${{ matrix.arch }}
          path: target/packages/*.dmg

  windows:
    name: Windows installer and portable zip
    needs: notices
    runs-on: windows-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      ROOSTE_TEST_SSH_USER: rooste
      # Throwaway account on an ephemeral runner; must not contain the user name.
      ROOSTE_TEST_SSH_PASSWORD: Kq7-vTn2-Lw9-xP!
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The cache can restore output from an earlier run; start clean.
      - name: Remove old packages
        shell: bash
        run: rm -rf target/packages target/winget target/rooste-ssh-*
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: target/notices
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rooste-ssh") | .version')" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p rooste-ssh -p rooste-cli
      # Windows without the Visual C++ Redistributable has no VCRUNTIME140.dll;
      # .cargo/config.toml links the C runtime in instead.
      - name: Check the executables don't need the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($exe in "target\release\rooste-ssh.exe", "target\release\rooste-cli.exe") {
            if (Select-String -Path $exe -Pattern 'VCRUNTIME140' -SimpleMatch -Quiet) {
              Write-Error "$exe imports VCRUNTIME140.dll"; exit 1
            }
          }
      - name: Sign executables
        if: env.HAS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 target\release\rooste-ssh.exe target\release\rooste-cli.exe
      - run: cargo packager --release -p rooste-ssh --formats wix
      - name: Consistent file name
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\packages\*.msi | Select-Object -First 1
          Rename-Item $msi.FullName "rooste-ssh-${{ steps.version.outputs.version }}-x64.msi"
      # New versions must keep the first releases' upgrade code to upgrade
      # existing installs (see packaging/windows/main.wxs).
      - name: Check the upgrade code
        shell: pwsh
        run: |
          $msi = Get-ChildItem target\packages\*.msi | Select-Object -First 1
          if (-not (Select-String -Path $msi.FullName -Pattern '47B656CC-8CE9-57F4-AADC-857E1148F647' -SimpleMatch -Quiet)) {
            Write-Error "The MSI's upgrade code changed"; exit 1
          }
      - name: Sign installer
        if: env.HAS_CERTIFICATE == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 (Get-ChildItem target\packages\*.msi).FullName
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "rooste-ssh-${{ steps.version.outputs.version }}-windows-x64-portable"
          New-Item -ItemType Directory "target\$name" | Out-Null
          Copy-Item target\release\rooste-ssh.exe, target\release\rooste-cli.exe, LICENSE, target\notices\THIRD-PARTY-LICENSES.html "target\$name"
          # An empty `portable` file keeps settings next to the executable.
          New-Item -ItemType File "target\$name\portable" | Out-Null
          Compress-Archive -Path "target\$name\*" -DestinationPath "target\packages\$name.zip"
          Get-ChildItem target\packages
      - name: Smoke test the installed MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target\packages\*.msi).FullName
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 50; exit $p.ExitCode }
          $cli = Get-ChildItem "$env:ProgramFiles\Rooste SSH" -Recurse -Filter rooste-cli.exe | Select-Object -First 1
          if (-not $cli) { Get-ChildItem "$env:ProgramFiles" -Recurse -Filter rooste*.exe -ErrorAction SilentlyContinue; exit 1 }
          & $cli.FullName --version
          # Log in to the Windows OpenSSH Server with the installed client.
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          $password = ConvertTo-SecureString $env:ROOSTE_TEST_SSH_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:ROOSTE_TEST_SSH_USER -Password $password -PasswordNeverExpires
          Add-LocalGroupMember -Group Administrators -Member $env:ROOSTE_TEST_SSH_USER
          Start-Service sshd
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Copy-Item crates/rooste-testkit/docker/authorized_keys $keys
          icacls $keys /inheritance:r /grant "*S-1-5-32-544:F" /grant "SYSTEM:F"
          Restart-Service sshd
          # sshd can take a moment after a restart; wait for the port, then
          # allow a few attempts.
          for ($i = 0; $i -lt 30 -and -not (Test-NetConnection 127.0.0.1 -Port 22 -InformationLevel Quiet); $i++) { Start-Sleep 1 }
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $out = & $cli.FullName -i crates/rooste-testkit/keys/id_ed25519 --no-agent --host-key accept-new --known-hosts "$env:RUNNER_TEMP\known_hosts" "$env:ROOSTE_TEST_SSH_USER@127.0.0.1" echo smoke-ok
            Write-Output $out
            if (($out | Out-String).Trim() -eq "smoke-ok") { exit 0 }
            Write-Output "Login attempt $attempt failed; retrying"
            Start-Sleep 3
          }
          exit 1
      - name: Smoke test the portable zip
        shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem target\packages\*.zip).FullName "$env:RUNNER_TEMP\portable"
          & "$env:RUNNER_TEMP\portable\rooste-cli.exe" --version
          & "$env:RUNNER_TEMP\portable\rooste-ssh.exe" --version
      - name: winget manifests
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $sha = (Get-FileHash (Get-ChildItem target\packages\*.msi).FullName -Algorithm SHA256).Hash
          New-Item -ItemType Directory target\winget | Out-Null
          foreach ($file in Get-ChildItem packaging\winget\*.yaml) {
            (Get-Content $file.FullName -Raw).Replace("{{VERSION}}", $version).Replace("{{MSI_SHA256}}", $sha) |
              Set-Content -NoNewline "target\winget\$($file.Name)"
          }
          Get-Content target\winget\*.installer.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            target/packages/*.msi
            target/packages/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: target/winget/*.yaml

  flatpak:
    name: Flatpak bundle
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: packaging/flatpak/staging
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: packaging/flatpak/staging
      - name: Stage files
        run: |
          cp packaging/linux/* packaging/icons/icon-256.png packaging/flatpak/staging/
          chmod +x packaging/flatpak/staging/rooste-ssh packaging/flatpak/staging/rooste-cli
          ls -la packaging/flatpak/staging
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: rooste-ssh.flatpak
          manifest-path: packaging/flatpak/ee.prica.rooste-ssh.yml
          cache: false

  snap:
    name: Snap
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: packaging/snap/staging
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: packaging/snap/staging
      - name: Stage files
        run: |
          cp packaging/linux/* packaging/icons/icon-256.png packaging/snap/staging/
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="rooste-ssh") | .version' > packaging/snap/staging/VERSION
          ls -la packaging/snap/staging
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap
      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}

  # Needs classic confinement approved for rooste-ssh in the Snap Store and an
  # upload token in the SNAPCRAFT_STORE_CREDENTIALS secret; then set the
  # repository variable SNAP_STORE_PUBLISH to "true".
  snap-store:
    name: Publish to the Snap Store
    if: startsWith(github.ref, 'refs/tags/v') && vars.SNAP_STORE_PUBLISH == 'true'
    needs: [publish, snap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap
      - name: Find the snap
        id: file
        run: echo "snap=$(ls rooste-ssh_*.snap)" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: stable

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="rooste-ssh") | .version')
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Collect files and checksums
        run: |
          mkdir release
          find artifacts \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \
            -o -name '*.msi' -o -name '*.zip' -o -name '*.dmg' -o -name '*.flatpak' -o -name 'THIRD-PARTY-LICENSES.html' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section, without its heading, up to the next one.
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          if grep -q "^## \[$version\] - unreleased" CHANGELOG.md; then
            echo "Set the release date for $version in CHANGELOG.md"; exit 1
          fi
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "Rooste SSH ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes

  # Needs the crates to exist on crates.io and trusted publishing set up for
  # each of them (crates.io → crate → Settings → Trusted Publishing, this
  # repository and release.yml); then set the repository variable
  # CRATES_IO_TRUSTED_PUBLISHING to "true".
  crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v') && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # One crate at a time, skipping versions already on crates.io and
      # waiting out rate limits, so this job can simply be re-run.
      - run: python3 .github/scripts/publish_crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
