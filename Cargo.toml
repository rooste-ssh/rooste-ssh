[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/rooste-ssh/rooste-ssh"
homepage = "https://github.com/rooste-ssh/rooste-ssh"
authors = ["Martin Vooremäe"]

[workspace.dependencies]
# The internal crates are published to crates.io together with the app; keep
# these versions equal to the workspace version above.
rooste-core = { path = "crates/rooste-core", version = "=0.4.0" }
rooste-protocols = { path = "crates/rooste-protocols", version = "=0.4.0" }
rooste-terminal = { path = "crates/rooste-terminal", version = "=0.4.0" }
rooste-keys = { path = "crates/rooste-keys", version = "=0.4.0" }
rooste-sftp = { path = "crates/rooste-sftp", version = "=0.4.0" }
# Test fixtures only; not published.
rooste-testkit = { path = "crates/rooste-testkit" }

alacritty_terminal = { version = "0.26.0", default-features = false }
aes = "0.9.3"
anyhow = "1.0.104"
argon2 = "0.6.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
cbc = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37.0"
# The bundled icons (➕, ⟳, 📁, …), so they look the same on every system.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
insta = "1.49.0"
egui_tiles = "0.18.0"
keyring = "4.2.0"
proptest = "1.12.0"
serial2-tokio = { version = "0.1.25", features = ["unix", "windows"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "1.1.8"
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "json"] }
uuid = { version = "1.28.0", features = ["v4"] }
winreg = "0.56.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
des = "0.9.0"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
md5 = "0.8.1"
rand = "0.10.3"
rfd = "0.17.2"
rhai = { version = "1.26.1", default-features = false, features = ["std"] }
rpassword = "7.5.4"
russh-sftp = "3.0.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Key derivation is unusably slow unoptimized (PPK files use Argon2).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
